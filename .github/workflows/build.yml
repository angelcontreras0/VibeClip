name: Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/VibeClip.App/VibeClip.App.csproj --configuration Release
      - run: dotnet run --project tests/VibeClip.Core.Checks --configuration Release
      - run: dotnet run --project tests/VibeClip.Ui.Checks --configuration Release
      - run: dotnet publish src/VibeClip.App/VibeClip.App.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/VibeClip
      - uses: actions/upload-artifact@v4
        with:
          name: VibeClip-windows-x64-preview
          path: artifacts/VibeClip/
